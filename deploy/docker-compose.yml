name: headgate

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  upstream:
    build:
      context: ..
    image: headgate:dev
    command: ["upstream"]
    ports:
      - "9000:9000"

  gateway-1:
    image: headgate:dev
    command: ["gateway"]
    environment:
      CONFIG_FILE: /etc/headgate/headgate.yaml
      BACKEND: ${BACKEND:-redis}
      ALGORITHM: ${ALGORITHM:-sliding_log}
      MIN_IDLE_CONNS: ${MIN_IDLE_CONNS:-16}
      DENY_CACHE: ${DENY_CACHE:-true}
    volumes:
      - ./headgate.yaml:/etc/headgate/headgate.yaml:ro
    ports:
      - "8081:8080"
      - "9101:9100"
    depends_on:
      - upstream
      - redis

  gateway-2:
    image: headgate:dev
    command: ["gateway"]
    environment:
      CONFIG_FILE: /etc/headgate/headgate.yaml
      BACKEND: ${BACKEND:-redis}
      ALGORITHM: ${ALGORITHM:-sliding_log}
      MIN_IDLE_CONNS: ${MIN_IDLE_CONNS:-16}
      DENY_CACHE: ${DENY_CACHE:-true}
    volumes:
      - ./headgate.yaml:/etc/headgate/headgate.yaml:ro
    ports:
      - "8082:8080"
      - "9102:9100"
    depends_on:
      - upstream
      - redis

  gateway-3:
    image: headgate:dev
    command: ["gateway"]
    environment:
      CONFIG_FILE: /etc/headgate/headgate.yaml
      BACKEND: ${BACKEND:-redis}
      ALGORITHM: ${ALGORITHM:-sliding_log}
      MIN_IDLE_CONNS: ${MIN_IDLE_CONNS:-16}
      DENY_CACHE: ${DENY_CACHE:-true}
    volumes:
      - ./headgate.yaml:/etc/headgate/headgate.yaml:ro
    ports:
      - "8083:8080"
      - "9103:9100"
    depends_on:
      - upstream
      - redis

  k6:
    image: grafana/k6:0.54.0
    profiles: ["bench"]
    volumes:
      - ../bench/k6:/scripts:ro
      - ${RESULTS_DIR:-../bench/results}:/results
    environment:
      TARGETS: http://gateway-1:8080,http://gateway-2:8080,http://gateway-3:8080
      UPSTREAM_URL: http://upstream:9000
      RATE_LIMIT: "100"
      KEY_COUNT: ${KEY_COUNT:-5}
      RATE_PER_KEY: ${RATE_PER_KEY:-600}
      DURATION: ${DURATION:-30s}
