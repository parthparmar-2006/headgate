listen: ":8080"
metrics_listen: ":9100"
upstream: "http://upstream:9000"
backend: ${BACKEND}

redis:
  addr: "redis:6379"
  timeout: 50ms
  min_idle_conns: ${MIN_IDLE_CONNS}

deny_cache:
  enabled: ${DENY_CACHE}
  max_keys: 100000

tenants:
  acme: [key-0, key-1]
  globex: [key-2]

routes:
  - name: default
    path_prefix: /
    algorithm: ${ALGORITHM}
    on_redis_error: fail_closed
    limits:
      - per: key
        limit: 100
        window: 1s
      - per: tenant
        limit: 150
        window: 1s
      - per: route
        limit: 1000
        window: 1s

  - name: open
    path_prefix: /open
    algorithm: ${ALGORITHM}
    on_redis_error: fail_open
    limits:
      - per: key
        limit: 100
        window: 1s

  - name: closed
    path_prefix: /closed
    algorithm: ${ALGORITHM}
    on_redis_error: fail_closed
    limits:
      - per: key
        limit: 100
        window: 1s

  - name: bench
    path_prefix: /bench
    algorithm: ${ALGORITHM}
    on_redis_error: fail_closed
    limits:
      - per: key
        limit: 100000
        window: 1s
